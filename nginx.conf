# Round-robins :8000 across the three stateless app instances; max_fails/
# fail_timeout route around an instance that goes down, so serving continues.

events {
    worker_connections 1024;
}

http {
    upstream train_apps {
        server app-1:8000 max_fails=3 fail_timeout=10s;
        server app-2:8000 max_fails=3 fail_timeout=10s;
        server app-3:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8000;

        location / {
            proxy_pass http://train_apps;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            # Retry the next upstream if one app errors or times out.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
